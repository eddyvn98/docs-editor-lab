name: Editor UX checks
on:
  push:
    branches: [gpt/lark-docs-ux]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Source line limit
        run: find src tests -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.css' -o -name '*.mjs' \) -exec sh -c 'for f; do n=$(wc -l < "$f"); if [ "$n" -ge 300 ]; then echo "$f has $n lines"; exit 1; fi; done' sh {} +
      - name: Install browser deps
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks desktop and mobile
        run: npm run test:browser
